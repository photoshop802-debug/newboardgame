<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拔毛運動會 Chicken Race v4</title>
<style>
:root{
    --bg:#ededdb;
    --board:#e1dbcd;
    --primary:#4e6e58;
    --turn:#e63946;
}
html,body{height:100%;margin:0;}
body{
    font-family:'PingFang TC','Microsoft JhengHei',Arial,sans-serif;
    background:var(--bg);
    user-select:none;
    overflow:hidden;
}
button{
    font-family:inherit;
    background:var(--primary);color:#fff;border:none;
    padding:14px 40px;font-size:18px;border-radius:30px;
    cursor:pointer;font-weight:bold;transition:all .2s;
}
button:hover{filter:brightness(1.1);transform:translateY(-2px);}

/* ===== 設定玩家面板 ===== */
#setup-panel{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    background:#fff;padding:30px 36px;border-radius:24px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    width:min(480px,92vw);box-sizing:border-box;text-align:center;
    max-height:94vh;overflow:auto;
}
#setup-panel h1{margin:0 0 6px;color:#2f3e46;font-size:32px;}
#setup-panel h2{color:var(--primary);margin:8px 0 18px;font-size:20px;}
.form-group{margin-bottom:16px;text-align:left;}
.form-group label{display:block;margin-bottom:6px;font-weight:bold;color:#333;font-size:15px;}
.form-group select,.form-group input[type=text]{
    width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px;box-sizing:border-box;font-family:inherit;
}

/* ===== 遊戲主畫面：左(玩家)｜中(版圖)｜右(大螢幕) ===== */
#game{
    display:none;height:100vh;box-sizing:border-box;padding:12px 14px;gap:16px;
    grid-template-columns:clamp(150px,13vw,240px) minmax(0,1fr) clamp(270px,25vw,470px);
}
#game.on{display:grid;}

/* 左側玩家直條 */
#players-col{display:flex;flex-direction:column;justify-content:center;gap:18px;min-height:0;}
.pcard{
    position:relative;border-radius:22px;padding:14px 12px 12px;color:#fff;
    background:var(--pc);box-shadow:0 4px 10px rgba(0,0,0,.12);
    transition:transform .35s, opacity .35s, filter .35s;
    opacity:.5;filter:saturate(.55);
}
.pc-top{display:flex;align-items:center;gap:8px;}
.pchick{
    width:44px;height:44px;flex:none;border-radius:50%;border:3px solid #fff;
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;
    background:rgba(0,0,0,.18);
}
.pname{font-weight:900;font-size:clamp(15px,1.35vw,22px);line-height:1.2;word-break:break-all;}
.pfeather{margin-top:8px;font-size:clamp(18px,1.6vw,28px);font-weight:900;display:flex;align-items:center;gap:6px;}
.pnum{display:inline-block;background:#ffe14d;color:#222;border-radius:12px;padding:0 10px;}
.pnow{display:none;margin-top:8px;text-align:center;background:#fff;color:var(--pc);border-radius:14px;font-weight:900;font-size:clamp(15px,1.3vw,22px);padding:3px 0;}
.turn-tag{display:none;position:absolute;right:-26px;top:50%;margin-top:-20px;font-size:36px;color:var(--pc);text-shadow:0 2px 0 #fff;}
.pcard.active{opacity:1;filter:none;transform:scale(1.08) translateX(6px);animation:activeGlow 1.2s infinite;z-index:2;}
.pcard.active .pnow{display:block;animation:blinkTxt .8s infinite alternate;}
.pcard.active .turn-tag{display:block;animation:nudge .7s infinite alternate;}
@keyframes activeGlow{
    0%,100%{box-shadow:0 0 0 4px #fff,0 0 16px 4px var(--pc);}
    50%{box-shadow:0 0 0 6px #fff,0 0 40px 14px var(--pc);}
}
@keyframes blinkTxt{from{transform:scale(1);}to{transform:scale(1.07);}}
@keyframes nudge{from{transform:translateX(0);}to{transform:translateX(8px);}}
.bump{animation:bump .5s;}
@keyframes bump{0%{transform:scale(1);}40%{transform:scale(1.6);}100%{transform:scale(1);}}

/* 中央版圖 */
#board-area{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;}
#board-scaler{position:relative;}
#board{
    position:absolute;left:0;top:0;width:1160px;height:820px;transform-origin:0 0;
    background:var(--board);border-radius:56px;
    animation:frameGlow 1.5s infinite;
}
@keyframes frameGlow{
    0%,100%{box-shadow:inset 0 0 30px rgba(0,0,0,.12),0 0 0 8px var(--turn),0 0 12px 4px var(--turn);}
    50%{box-shadow:inset 0 0 30px rgba(0,0,0,.12),0 0 0 8px var(--turn),0 0 34px 12px var(--turn);}
}

/* 24 顆蛋 */
.egg{
    position:absolute;width:100px;height:132px;box-sizing:border-box;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    border:3px solid #555;box-shadow:0 5px 10px rgba(0,0,0,.15);
    transform:rotate(var(--rot)) scale(var(--sc,1));
    transition:transform .35s, border-color .35s;z-index:5;
}
.egg .sym{
    position:absolute;left:50%;top:8px;width:74px;height:74px;margin-left:-37px;
    display:flex;align-items:center;justify-content:center;
    transform:rotate(calc(-1 * var(--rot)));
}
.egg .sym span{font-size:56px;line-height:1;display:block;}
.egg.target{--sc:1.22;z-index:9;border:6px solid var(--turn);animation:targetGlow .8s infinite alternate;}
.egg.target .sym span{animation:symPop .8s infinite alternate;}
@keyframes targetGlow{from{box-shadow:0 0 10px 4px var(--turn);}to{box-shadow:0 0 38px 16px var(--turn);}}
@keyframes symPop{from{transform:scale(1);}to{transform:scale(1.18);}}

/* 前進弧線箭頭 */
#arrow-svg{position:absolute;left:0;top:0;width:1160px;height:820px;pointer-events:none;z-index:11;overflow:visible;}
#arrow-path{fill:none;stroke-width:11;stroke-linecap:round;stroke-dasharray:2 20;animation:dashMove .6s linear infinite;}
@keyframes dashMove{to{stroke-dashoffset:-22;}}

/* 中央 12 張蓋牌 */
#center-pool{
    position:absolute;left:323px;top:228px;width:514px;height:364px;
    display:grid;grid-template-columns:repeat(4,112px);grid-template-rows:repeat(3,112px);
    column-gap:22px;row-gap:14px;z-index:4;
}
.ccard{position:relative;width:112px;height:112px;cursor:pointer;perspective:700px;transition:transform .2s;}
.ccard:not(.flipped):hover{transform:translateY(-5px);}
.ccard .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.4,.5,1);}
.ccard.flipped .inner{transform:rotateY(180deg) scale(1.3);}
.ccard.flipped{z-index:6;}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.face.back{filter:drop-shadow(0 5px 5px rgba(0,0,0,.25));}
.face.back .oct{
    position:absolute;inset:0;
    background:radial-gradient(circle at 35% 30%,#74c69d,#40916c 75%);
    clip-path:polygon(30% 0%,70% 0%,100% 30%,100% 70%,70% 100%,30% 100%,0% 70%,0% 30%);
    display:flex;align-items:center;justify-content:center;
    font-size:46px;font-weight:900;color:rgba(255,255,255,.3);
}
.face.front{
    transform:rotateY(180deg);border-radius:18px;border:5px solid #ffb703;box-sizing:border-box;
    display:flex;align-items:center;justify-content:center;font-size:74px;
    box-shadow:0 6px 14px rgba(0,0,0,.25);
}
.mark{
    position:absolute;right:-16px;bottom:-16px;width:46px;height:46px;border-radius:50%;
    display:none;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#fff;border:3px solid #fff;
}
.ccard.good .face.front{border-color:#2ecc71;box-shadow:0 0 30px 12px #2ecc71;}
.ccard.good .mark{display:flex;background:#2ecc71;}
.ccard.bad .face.front{border-color:#e63946;box-shadow:0 0 30px 12px #e63946;}
.ccard.bad .mark{display:flex;background:#e63946;}
.ccard.bad{animation:shakeX .5s;}
@keyframes shakeX{0%,100%{transform:translateX(0);}20%{transform:translateX(-12px);}40%{transform:translateX(12px);}60%{transform:translateX(-8px);}80%{transform:translateX(8px);}}

/* 小雞 */
.chicken{position:absolute;width:58px;height:58px;z-index:12;pointer-events:none;transition:left .32s ease-in-out,top .32s ease-in-out;}
.chicken .body{
    width:100%;height:100%;border-radius:50%;border:4px solid #fff;box-sizing:border-box;
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:24px;
    box-shadow:0 5px 12px rgba(0,0,0,.4);text-shadow:1px 1px 2px rgba(0,0,0,.5);
}
.chicken .badge{
    position:absolute;top:-14px;right:-18px;background:#ffe14d;border:2px solid #333;border-radius:14px;
    padding:1px 6px;font-size:16px;font-weight:900;color:#000;white-space:nowrap;
}
.chicken .badge:empty{display:none;}
.chicken.active{z-index:14;}
.chicken.active::before{
    content:'';position:absolute;inset:-10px;border-radius:50%;border:5px solid var(--turn);
    animation:ring 1.1s infinite;
}
.chicken.active .body{animation:bob .6s infinite alternate;}
@keyframes ring{from{transform:scale(.8);opacity:1;}to{transform:scale(1.7);opacity:0;}}
@keyframes bob{from{transform:translateY(0);}to{transform:translateY(-7px) scale(1.06);}}
.chicken.moving{z-index:30;}
.chicken.hop .body{animation:hop .34s ease-out;}
@keyframes hop{0%{transform:translateY(0) scale(1.1,.9);}45%{transform:translateY(-40px) scale(.95,1.08);}85%{transform:translateY(0) scale(1.15,.85);}100%{transform:translateY(0) scale(1);}}
.chicken.shake .body{animation:chShake .55s;}
@keyframes chShake{0%,100%{transform:rotate(0);}20%{transform:rotate(-22deg);}40%{transform:rotate(18deg);}60%{transform:rotate(-12deg);}80%{transform:rotate(8deg);}}

.fx{position:absolute;pointer-events:none;z-index:40;}
.float-txt{
    font-size:38px;font-weight:900;color:#fff;white-space:nowrap;
    -webkit-text-stroke:2px #333;paint-order:stroke fill;text-shadow:0 3px 0 rgba(0,0,0,.25);
}

/* 右側：大螢幕 */
#right-col{display:flex;flex-direction:column;gap:12px;padding-top:56px;min-height:0;}
.panel{
    background:#fff;border-radius:22px;box-shadow:0 4px 12px rgba(0,0,0,.06);
    padding:10px 14px;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;overflow:hidden;
    box-sizing:border-box;min-height:0;container-type:inline-size;
}
.panel h3{margin:0;font-size:clamp(16px,1.5vw,26px);color:#2f3e46;text-align:center;}
#reveal-panel{flex:1.7;border:7px solid #ccc;transition:border-color .3s, background .3s;}
#reveal-card{
    width:min(62cqw,calc(34vh - 60px));aspect-ratio:1;border-radius:26px;box-sizing:border-box;margin:4px 0;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-size:min(43cqw,calc(24vh - 42px));line-height:1;
    background:#f1f1f1;border:5px dashed #bbb;color:#bbb;
}
#reveal-card.empty{font-size:min(20cqw,9vh);font-weight:900;}
#reveal-card.empty.count{font-size:min(40cqw,calc(22vh - 30px));color:var(--turn);border:6px solid var(--turn);background:#fff;font-family:Arial,sans-serif;}
#reveal-card.empty.count.hurry{color:#fff;background:#e63946;border-color:#e63946;animation:bump .5s infinite;}
#reveal-card.show{border:6px solid #ffb703;color:#000;animation:revealIn .55s cubic-bezier(.3,1.5,.5,1);}
@keyframes revealIn{0%{transform:rotateY(90deg) scale(.6);}100%{transform:rotateY(0) scale(1);}}
#reveal-who{font-size:clamp(15px,1.5vw,26px);font-weight:900;min-height:1.3em;text-align:center;}
#minimap{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;width:min(36cqw,calc(14vh - 6px));margin:4px 0;flex:none;}
#minimap.hidden{display:none;}
.mm{aspect-ratio:1;background:#b7e4c7;clip-path:polygon(30% 0%,70% 0%,100% 30%,100% 70%,70% 100%,30% 100%,0% 70%,0% 30%);}
.mm.hit{background:#ff006e;animation:mmBlink .5s infinite alternate;}
@keyframes mmBlink{from{opacity:1;}to{opacity:.45;}}
#reveal-result{font-size:clamp(18px,min(2.2vw,4.6vh),40px);font-weight:900;min-height:1.25em;}
#reveal-result.ok{color:#1b9e4b;animation:bump .5s;}
#reveal-result.no{color:#e63946;animation:shakeX .5s;}

#target-panel{flex:1;border:7px solid var(--turn);transition:border-color .3s;}
#target-who{font-size:clamp(16px,1.6vw,28px);font-weight:900;color:var(--turn);text-align:center;}
#target-egg{
    width:min(24cqw,10vh);aspect-ratio:100/132;margin:4px 0;flex:none;box-sizing:border-box;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;border:5px solid var(--turn);
    display:flex;align-items:center;justify-content:center;font-size:min(16cqw,6.5vh);
    animation:targetGlow .8s infinite alternate;
}
#target-name{font-size:clamp(18px,1.9vw,32px);font-weight:900;}
#target-tip{font-size:clamp(13px,1.1vw,18px);color:#666;text-align:center;}

@media (max-height:760px){#reveal-panel{flex:2.3;} #target-tip{display:none;} .panel h3{font-size:16px;}}
#timer-box{display:none;width:90%;margin-top:4px;text-align:center;}
#timer-box.on{display:block;}
#target-panel:has(#timer-box.on) #target-tip{display:none;}
#timer-num{font-size:clamp(20px,2vw,34px);font-weight:900;color:#2f3e46;}
#timer-bar{height:12px;border-radius:6px;background:#eee;overflow:hidden;margin-top:2px;}
#timer-fill{height:100%;width:100%;background:var(--turn);transition:width .25s linear;}
#timer-box.hurry #timer-num{color:#e63946;animation:bump .5s infinite;}
#timer-box.hurry #timer-fill{background:#e63946;}
/* 齒輪 */
#gear-btn{
    position:fixed;top:10px;right:14px;z-index:80;width:50px;height:50px;padding:0;border-radius:50%;
    font-size:28px;background:#fff;color:#333;box-shadow:0 3px 10px rgba(0,0,0,.15);
}
#gear-btn:hover{transform:rotate(60deg);}
#mute-btn{
    position:fixed;top:10px;right:74px;z-index:80;width:50px;height:50px;padding:0;border-radius:50%;
    font-size:24px;background:#fff;color:#333;box-shadow:0 3px 10px rgba(0,0,0,.15);
}
#settings-overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;align-items:center;justify-content:center;
}
#settings-overlay.on{display:flex;}
#settings-card{background:#fff;border-radius:22px;padding:24px 30px;width:min(460px,92vw);box-sizing:border-box;max-height:92vh;overflow:auto;}
#settings-card h2{margin:0 0 16px;color:#2f3e46;}
.srow{margin-bottom:16px;}
.srow label{font-weight:bold;display:block;margin-bottom:6px;font-size:16px;}
.srow input[type=range]{width:100%;}
.chk{display:flex;align-items:center;gap:10px;font-size:16px;margin:10px 0;cursor:pointer;}
.chk input{width:22px;height:22px;}
.sbtns{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
.sbtns button{padding:10px 24px;font-size:16px;}
button.gray{background:#6c757d;}
button.danger{background:#b5555a;}

/* 換人大橫幅 */
#turn-banner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:60;}
#turn-banner .ban{
    background:var(--bc,#e63946);color:#fff;text-align:center;
    font-size:clamp(34px,5vw,86px);font-weight:900;padding:22px 60px;border-radius:60px;
    border:8px solid #fff;box-shadow:0 20px 60px rgba(0,0,0,.35);text-shadow:0 4px 0 rgba(0,0,0,.25);
    transform:translateX(-130vw);
}
#turn-banner .ban small{display:block;font-size:.55em;margin-top:6px;}
#turn-banner.show .ban{animation:banner var(--bd,1.9s) cubic-bezier(.2,.9,.3,1) forwards;}
@keyframes banner{
    0%{transform:translateX(-130vw) rotate(-6deg);}
    18%{transform:translateX(0) rotate(2deg) scale(1.06);}
    28%{transform:translateX(0) rotate(0) scale(1);}
    82%{transform:translateX(0) scale(1);}
    100%{transform:translateX(130vw) rotate(6deg);}
}
#edge-flash{
    position:fixed;inset:0;pointer-events:none;z-index:55;opacity:0;
    box-shadow:inset 0 0 0 18px var(--turn),inset 0 0 140px 50px var(--turn);
}
#edge-flash.go{animation:edge 1.5s;}
@keyframes edge{0%,100%{opacity:0;}15%,45%{opacity:1;}30%,60%{opacity:.3;}}

/* 勝利 */
#win-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;justify-content:center;align-items:center;}
#win-card{background:#fff;padding:40px 60px;border-radius:25px;text-align:center;color:#333;animation:revealIn .7s cubic-bezier(.3,1.5,.5,1);}
.confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:101;pointer-events:none;border-radius:3px;}
</style>
</head>
<body>

<button id="mute-btn" title="靜音 / 開聲音" onclick="toggleMute()">🔊</button>
<button id="gear-btn" title="設定" onclick="openSettings()">⚙️</button>

<!-- 設定玩家 -->
<div id="setup-panel">
    <h1>🐔 拔毛運動會</h1>
    <h2>設定玩家數與姓名</h2>
    <div class="form-group">
        <label for="player-count">選擇參賽人數 (2 - 4人)：</label>
        <select id="player-count" onchange="updateNameInputs()">
            <option value="2">2 人親密對決</option>
            <option value="3">3 人家族混戰</option>
            <option value="4" selected>4 人派對大亂斗</option>
        </select>
    </div>
    <div id="name-inputs-container"></div>
    <button onclick="startGame()">開始運動會！</button>
</div>

<!-- 遊戲畫面 -->
<div id="game">
    <div id="players-col"></div>

    <div id="board-area">
        <div id="board-scaler">
            <div id="board">
                <div id="center-pool"></div>
                <svg id="arrow-svg" viewBox="0 0 1160 820">
                    <defs>
                        <marker id="arrow-head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse">
                            <path id="arrow-head-path" d="M0,0 L10,5 L0,10 z" fill="#e63946"/>
                        </marker>
                    </defs>
                    <path id="arrow-path" d="" stroke="#e63946" marker-end="url(#arrow-head)"/>
                </svg>
                <div id="chickens-container"></div>
            </div>
        </div>
    </div>

    <div id="right-col">
        <div class="panel" id="reveal-panel">
            <h3>👀 翻牌大螢幕</h3>
            <div id="reveal-card" class="empty">？</div>
            <div id="reveal-who">等待翻牌…</div>
            <div id="minimap"></div>
            <div id="reveal-result"></div>
        </div>
        <div class="panel" id="target-panel">
            <div id="target-who">紅隊小雞 要找</div>
            <div id="target-egg">🍀</div>
            <div id="target-name">幸運草</div>
            <div id="target-tip">👉 在中間的綠色牌裡找出它！</div>
            <div id="timer-box"><div id="timer-num">⏰ 15 秒</div><div id="timer-bar"><div id="timer-fill"></div></div></div>
        </div>
    </div>
</div>

<div id="turn-banner"><div class="ban" id="banner-box"></div></div>
<div id="edge-flash"></div>

<!-- 設定 -->
<div id="settings-overlay" onclick="if(event.target===this) closeSettings()">
    <div id="settings-card">
        <h2>⚙️ 遊戲設定</h2>
        <div class="srow">
            <label>翻開後停留 <b id="rv-val">3</b> 秒才蓋回去</label>
            <input type="range" id="s-reveal" min="1" max="10" step="0.5">
        </div>
        <div class="srow">
            <label>音量 <b id="vol-val">80</b>%</label>
            <input type="range" id="s-vol" min="0" max="1" step="0.05">
        </div>
        <label class="chk"><input type="checkbox" id="s-tl"> ⏰ 限時翻牌（時間到沒翻就換下一位）</label>
        <div class="srow" id="tl-row">
            <label>每次翻牌限時 <b id="tl-val">15</b> 秒</label>
            <input type="range" id="s-tlsec" min="5" max="60" step="1">
        </div>
        <label class="chk"><input type="checkbox" id="s-sound"> 🎵 音效</label>
        <label class="chk"><input type="checkbox" id="s-voice"> 🗣️ 語音（輪到誰、答對了）</label>
        <label class="chk"><input type="checkbox" id="s-banner"> 🎌 換人時顯示大橫幅</label>
        <label class="chk"><input type="checkbox" id="s-minimap"> 🗺️ 大螢幕顯示「翻到哪一格」小地圖</label>
        <div class="sbtns">
            <button class="gray" onclick="testSound()">🔊 試聽</button>
            <button onclick="closeSettings()">完成</button>
        </div>
        <div class="sbtns">
            <button class="danger" onclick="location.reload()">🏠 回主選單（重新開始）</button>
        </div>
    </div>
</div>

<div id="win-overlay">

        <button onclick="location.reload()">再戰一局</button>
    </div>
</div>

<script>
/* ================= 資料 ================= */
const PATTERNS = [
    { id: 1,  symbol: "🍎", name: "蘋果",   bg: "#ffadad" },
    { id: 2,  symbol: "🥕", name: "紅蘿蔔", bg: "#ffd6a5" },
    { id: 3,  symbol: "🌻", name: "向日葵", bg: "#fdffb6" },
    { id: 4,  symbol: "🐳", name: "鯨魚",   bg: "#caf0f8" },
    { id: 5,  symbol: "🐢", name: "烏龜",   bg: "#cff1ef" },
    { id: 6,  symbol: "🍇", name: "葡萄",   bg: "#e2cfea" },
    { id: 7,  symbol: "🌸", name: "櫻花",   bg: "#ffc6ff" },
    { id: 8,  symbol: "👻", name: "小幽靈", bg: "#e2ece9" },
    { id: 9,  symbol: "🌲", name: "松樹",   bg: "#b7efc5" },
    { id: 10, symbol: "🐌", name: "蝸牛",   bg: "#fddcbb" },
    { id: 11, symbol: "🍀", name: "幸運草", bg: "#d8f3dc" },
    { id: 12, symbol: "🍄", name: "香菇",   bg: "#eddcd2" }
];
const P_COLORS = ["#e63946", "#457b9d", "#2a9d8f", "#f4a261"];

const BW = 1160, BH = 820, CX = 580, CY = 410, RX = 508, RY = 338, CHICK_IN = 50, TRACK_N = 24;

let trackPatterns = [], centerPatterns = [], players = [], trackPositions = [];
let cur = 0, targetTrackIndex = -1, busy = false, gameOver = false;
const chickenEls = {};

/* ================= 設定 ================= */
const DEFAULT_SETTINGS = { revealSec: 3, volume: 0.8, sound: true, voice: true, banner: true, minimap: true, timeLimitOn: false, timeLimitSec: 15 };
const SETTINGS_KEY = "chickenRaceSettingsV4";
function loadSettings() {
    try { return Object.assign({}, DEFAULT_SETTINGS, JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}")); }
    catch (e) { return Object.assign({}, DEFAULT_SETTINGS); }
}
function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {} }
let settings = loadSettings();

function openSettings() {
    ensureAudio(); SFX.click();
    document.getElementById("s-reveal").value = settings.revealSec;
    document.getElementById("rv-val").textContent = settings.revealSec;
    document.getElementById("s-vol").value = settings.volume;
    document.getElementById("vol-val").textContent = Math.round(settings.volume * 100);
    document.getElementById("s-sound").checked = settings.sound;
    document.getElementById("s-voice").checked = settings.voice;
    document.getElementById("s-banner").checked = settings.banner;
    document.getElementById("s-minimap").checked = settings.minimap;
    document.getElementById("s-tl").checked = settings.timeLimitOn;
    document.getElementById("s-tlsec").value = settings.timeLimitSec;
    document.getElementById("tl-val").textContent = settings.timeLimitSec;
    document.getElementById("tl-row").style.opacity = settings.timeLimitOn ? 1 : .4;
    document.getElementById("settings-overlay").classList.add("on");
}
function closeSettings() {
    SFX.click(); document.getElementById("settings-overlay").classList.remove("on");
    if (!settings.timeLimitOn) stopTimer();
    else if (!busy && !gameOver && players.length && !timerId) startTimer();
}
function bindSettings() {
    const on = (id, ev, fn) => document.getElementById(id).addEventListener(ev, fn);
    on("s-reveal", "input", e => { settings.revealSec = parseFloat(e.target.value); document.getElementById("rv-val").textContent = settings.revealSec; saveSettings(); });
    on("s-vol", "input", e => { settings.volume = parseFloat(e.target.value); document.getElementById("vol-val").textContent = Math.round(settings.volume * 100); if (master) master.gain.value = settings.volume; saveSettings(); });
    on("s-sound", "change", e => { settings.sound = e.target.checked; saveSettings(); updateMuteBtn(); });
    on("s-voice", "change", e => { settings.voice = e.target.checked; saveSettings(); updateMuteBtn(); });
    on("s-banner", "change", e => { settings.banner = e.target.checked; saveSettings(); });
    on("s-tl", "change", e => { settings.timeLimitOn = e.target.checked; document.getElementById("tl-row").style.opacity = settings.timeLimitOn ? 1 : .4; saveSettings(); });
    on("s-tlsec", "input", e => { settings.timeLimitSec = parseInt(e.target.value); document.getElementById("tl-val").textContent = settings.timeLimitSec; saveSettings(); });
    on("s-minimap", "change", e => { settings.minimap = e.target.checked; saveSettings(); document.getElementById("minimap").classList.toggle("hidden", !settings.minimap); });
}
function toggleMute() {
    const anyOn = settings.sound || settings.voice;
    settings.sound = !anyOn; settings.voice = !anyOn;
    saveSettings(); updateMuteBtn();
    if (!anyOn) { ensureAudio(); SFX.click(); } else { try { speechSynthesis.cancel(); } catch (e) {} }
}
function updateMuteBtn() { document.getElementById("mute-btn").textContent = (settings.sound || settings.voice) ? "🔊" : "🔇"; }
function testSound() { ensureAudio(); SFX.correct(); speak("答對，繼續找下一張！", true); }

/* ================= 音效（Web Audio 合成，不需外部檔案） ================= */
let actx = null, master = null;
function ensureAudio() {
    try {
        if (!actx) {
            actx = new (window.AudioContext || window.webkitAudioContext)();
            master = actx.createGain(); master.connect(actx.destination);
        }
        if (actx.state === "suspended") actx.resume();
        master.gain.value = settings.volume;
    } catch (e) {}
}
function tone(freq, dur, o = {}) {
    if (!settings.sound || !actx) return;
    const { type = "sine", vol = 0.3, delay = 0, slide = null, attack = 0.006 } = o;
    const t = actx.currentTime + delay;
    const osc = actx.createOscillator(), g = actx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(master); osc.start(t); osc.stop(t + dur + 0.03);
}
function noise(dur, o = {}) {
    if (!settings.sound || !actx) return;
    const { vol = 0.3, delay = 0, from = 800, to = 3000, q = 1.2, type = "bandpass" } = o;
    const t = actx.currentTime + delay;
    const len = Math.max(1, Math.floor(actx.sampleRate * dur));
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = actx.createBufferSource(); src.buffer = buf;
    const f = actx.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(from, t); f.frequency.exponentialRampToValueAtTime(to, t + dur);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t + dur + 0.03);
}
const SFX = {
    click()   { tone(880, 0.06, { type: "square", vol: 0.12 }); },
    flip()    { noise(0.22, { from: 600, to: 4500, vol: 0.4 }); tone(480, 0.14, { type: "triangle", vol: 0.15, slide: 950, delay: 0.04 }); },
    correct() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.3, { type: "triangle", vol: 0.28, delay: i * 0.09 })); tone(1568, 0.6, { vol: 0.12, delay: 0.36 }); tone(2093, 0.5, { vol: 0.08, delay: 0.45 }); },
    wrong()   { tone(233, 0.24, { type: "sawtooth", vol: 0.2, slide: 180 }); tone(185, 0.42, { type: "sawtooth", vol: 0.2, slide: 120, delay: 0.27 }); },
    hop()     { tone(300, 0.15, { vol: 0.32, slide: 820 }); noise(0.05, { from: 1800, to: 1200, vol: 0.12, delay: 0.27 }); },
    pluck()   { noise(0.14, { type: "highpass", from: 2500, to: 7000, vol: 0.4 }); tone(1500, 0.2, { type: "square", vol: 0.13, slide: 260, delay: 0.02 }); tone(600, 0.12, { vol: 0.25, slide: 1400, delay: 0.2 }); },
    swish()   { noise(0.35, { from: 3000, to: 400, vol: 0.25 }); },
    ding()    { tone(1319, 0.45, { vol: 0.25 }); tone(1976, 0.55, { vol: 0.1, delay: 0.05 }); },
    turn()    { [392, 523, 659].forEach((f, i) => tone(f, 0.16, { type: "square", vol: 0.11, delay: i * 0.11 })); tone(784, 0.5, { type: "square", vol: 0.13, delay: 0.33 }); },
    tick()    { tone(1000, 0.05, { type: "square", vol: 0.1 }); },
    timeout() { tone(880, 0.18, { type: "square", vol: 0.15 }); tone(660, 0.18, { type: "square", vol: 0.15, delay: 0.2 }); tone(440, 0.4, { type: "square", vol: 0.15, delay: 0.4 }); },
    go()      { tone(660, 0.12, { type: "triangle", vol: 0.2 }); tone(990, 0.25, { type: "triangle", vol: 0.2, delay: 0.1 }); },
    win()     {
        const m = [523, 523, 523, 659, 784, 659, 784, 1047];
        const tms = [0, .14, .28, .42, .62, .82, .96, 1.16];
        m.forEach((f, i) => { tone(f, i === m.length - 1 ? 0.9 : 0.2, { type: "square", vol: 0.13, delay: tms[i] }); tone(f / 2, 0.2, { type: "triangle", vol: 0.12, delay: tms[i] }); });
    }
};

/* ================= 語音 ================= */
let zhVoice = null;
function pickVoice() {
    try {
        const vs = speechSynthesis.getVoices();
        zhVoice = vs.find(v => /zh[-_]TW/i.test(v.lang)) || vs.find(v => /zh[-_](HK|CN)/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
    } catch (e) {}
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, cancel = false) {
    if (!settings.voice || !("speechSynthesis" in window)) return;
    try {
        if (cancel) speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "zh-TW"; if (zhVoice) u.voice = zhVoice;
        u.rate = 1.0; u.pitch = 1.2; u.volume = Math.min(1, settings.volume + 0.1);
        speechSynthesis.speak(u);
    } catch (e) {}
}

/* ================= 工具 ================= */
const sleep = ms => new Promise(r => setTimeout(r, ms));
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

/* ================= 設定玩家 ================= */
function updateNameInputs() {
    const count = parseInt(document.getElementById("player-count").value);
    const c = document.getElementById("name-inputs-container");
    const defaults = ["紅隊小雞", "藍隊小雞", "綠隊小雞", "橘隊小雞"];
    c.innerHTML = "";
    for (let i = 0; i < count; i++) {
        c.innerHTML += `<div class="form-group"><label>玩家 ${i + 1} 姓名：</label>
            <input type="text" id="player-name-${i}" value="${defaults[i]}" maxlength="8"></div>`;
    }
}
updateNameInputs();
bindSettings();
updateMuteBtn();
document.getElementById("minimap").classList.toggle("hidden", !settings.minimap);

function startGame() {
    ensureAudio(); SFX.click();
    const count = parseInt(document.getElementById("player-count").value);
    players = [];
    for (let i = 0; i < count; i++) {
        const v = document.getElementById(`player-name-${i}`).value.trim();
        players.push({ id: i, name: v || `玩家${i + 1}`, position: 0, feathers: 1 });
    }
    trackPatterns = shuffle([...PATTERNS, ...PATTERNS]);
    centerPatterns = shuffle([...PATTERNS]);
    const gap = Math.floor(TRACK_N / count);
    players.forEach((p, i) => p.position = i * gap);

    document.getElementById("setup-panel").style.display = "none";
    document.getElementById("game").classList.add("on");

    computeTrack();
    renderBoard();
    renderCenterPool();
    renderMinimap();
    renderPlayersCol();
    renderChickens();
    fitBoard();
    cur = 0;
    setTimeout(async () => { busy = true; await beginTurn(); busy = false; startTimer(); }, 300);
}

/* ================= 版圖縮放 ================= */
function fitBoard() {
    const area = document.getElementById("board-area");
    const w = area.clientWidth - 40, h = area.clientHeight - 40;
    if (w <= 0 || h <= 0) return;
    const s = Math.min(w / BW, h / BH);
    const scaler = document.getElementById("board-scaler");
    scaler.style.width = BW * s + "px"; scaler.style.height = BH * s + "px";
    document.getElementById("board").style.transform = `scale(${s})`;
}
window.addEventListener("resize", fitBoard);

/* ================= 跑道（等弧長分佈 24 顆蛋） ================= */
function computeTrack() {
    const N = 3600, pts = [], cum = [0];
    for (let i = 0; i <= N; i++) {
        const t = -Math.PI / 2 + (i / N) * 2 * Math.PI;
        pts.push([CX + RX * Math.cos(t), CY + RY * Math.sin(t), t]);
        if (i > 0) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    }
    const P = cum[N];
    trackPositions = [];
    let j = 0;
    for (let k = 0; k < TRACK_N; k++) {
        const target = k * P / TRACK_N;
        while (j < N && cum[j + 1] < target) j++;
        const [x, y, t] = pts[j];
        const phi = Math.atan2(Math.sin(t) / RY, Math.cos(t) / RX);
        trackPositions.push({
            x, y, theta: t, phi,
            cx: x - CHICK_IN * Math.cos(phi),
            cy: y - CHICK_IN * Math.sin(phi)
        });
    }
}

function renderBoard() {
    const board = document.getElementById("board");
    board.querySelectorAll(".egg").forEach(e => e.remove());
    trackPositions.forEach((tp, i) => {
        const pat = trackPatterns[i];
        const egg = document.createElement("div");
        egg.className = "egg"; egg.id = `track-${i}`;
        egg.style.left = (tp.x - 50) + "px";
        egg.style.top = (tp.y - 66) + "px";
        egg.style.background = pat.bg;
        egg.style.setProperty("--rot", (tp.phi * 180 / Math.PI + 90) + "deg");
        egg.innerHTML = `<div class="sym"><span>${pat.symbol}</span></div>`;
        board.appendChild(egg);
    });
}

function renderCenterPool() {
    const pool = document.getElementById("center-pool");
    pool.innerHTML = "";
    centerPatterns.forEach((pat, i) => {
        const c = document.createElement("div");
        c.className = "ccard"; c.id = `center-${i}`;
        c.innerHTML = `<div class="inner">
            <div class="face back"><div class="oct">?</div></div>
            <div class="face front" style="background:${pat.bg}">${pat.symbol}<div class="mark"></div></div>
        </div>`;
        c.addEventListener("click", () => onCardClick(i));
        pool.appendChild(c);
    });
}

function renderMinimap() {
    const mm = document.getElementById("minimap");
    mm.innerHTML = "";
    for (let i = 0; i < 12; i++) mm.innerHTML += `<div class="mm" id="mm-${i}"></div>`;
}

function renderPlayersCol() {
    const col = document.getElementById("players-col");
    col.innerHTML = "";
    players.forEach(p => {
        col.innerHTML += `<div class="pcard" id="pc-${p.id}" style="--pc:${P_COLORS[p.id]}">
            <div class="turn-tag">▶</div>
            <div class="pc-top"><div class="pchick">${p.name.charAt(0)}</div><div class="pname">${p.name}</div></div>
            <div class="pfeather">🪶 × <span class="pnum" id="pnum-${p.id}">${p.feathers}</span></div>
            <div class="pnow">輪到你！</div>
        </div>`;
    });
}

function renderChickens() {
    const c = document.getElementById("chickens-container");
    c.innerHTML = "";
    players.forEach(p => {
        const el = document.createElement("div");
        el.className = "chicken";
        el.innerHTML = `<div class="body" style="background:${P_COLORS[p.id]}">${p.name.charAt(0)}</div><div class="badge"></div>`;
        c.appendChild(el);
        chickenEls[p.id] = el;
        placeChicken(p, p.position);
        updateBadge(p);
    });
}
function placeChicken(p, idx) {
    const tp = trackPositions[idx];
    const el = chickenEls[p.id];
    el.style.left = (tp.cx - 29) + "px";
    el.style.top = (tp.cy - 29) + "px";
}
function updateBadge(p) {
    chickenEls[p.id].querySelector(".badge").textContent = p.feathers > 0 ? `🪶${p.feathers}` : "";
}
function updateScore(p, bump) {
    const n = document.getElementById(`pnum-${p.id}`);
    n.textContent = p.feathers;
    updateBadge(p);
    if (bump) { restart(n, "bump"); restart(chickenEls[p.id].querySelector(".badge"), "bump"); }
}

/* ================= 目標計算與提示 ================= */
function calculateNextTarget() {
    const p = players[cur];
    let next = (p.position + 1) % TRACK_N;
    while (players.find(o => o.position === next && o.id !== p.id)) next = (next + 1) % TRACK_N;
    targetTrackIndex = next;
}

function drawArrow(fromIdx, toIdx, color) {
    const a = trackPositions[fromIdx].theta;
    let b = trackPositions[toIdx].theta;
    while (b <= a) b += 2 * Math.PI;
    const pts = [];
    const N = 50;
    for (let i = 0; i <= N; i++) {
        const t = a + (b - a) * i / N;
        pts.push([CX + (RX - CHICK_IN) * Math.cos(t), CY + (RY - CHICK_IN) * Math.sin(t)]);
    }
    const s = pts[0], e = pts[N];
    const trimmed = pts.filter(q => Math.hypot(q[0] - s[0], q[1] - s[1]) > 38 && Math.hypot(q[0] - e[0], q[1] - e[1]) > 30);
    const path = document.getElementById("arrow-path");
    if (trimmed.length < 2) { path.setAttribute("d", ""); return; }
    path.setAttribute("d", "M" + trimmed.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" L"));
    path.setAttribute("stroke", color);
    document.getElementById("arrow-head-path").setAttribute("fill", color);
}
function clearArrow() { document.getElementById("arrow-path").setAttribute("d", ""); }

function updateTurnUI() {
    const p = players[cur];
    const color = P_COLORS[p.id];
    const tgt = trackPatterns[targetTrackIndex];
    document.documentElement.style.setProperty("--turn", color);

    players.forEach(o => {
        document.getElementById(`pc-${o.id}`).classList.toggle("active", o.id === p.id);
        chickenEls[o.id].classList.toggle("active", o.id === p.id);
    });
    document.querySelectorAll(".egg.target").forEach(e => e.classList.remove("target"));
    document.getElementById(`track-${targetTrackIndex}`).classList.add("target");
    drawArrow(p.position, targetTrackIndex, color);

    document.getElementById("target-who").textContent = `${p.name} 要找`;
    const te = document.getElementById("target-egg");
    te.textContent = tgt.symbol; te.style.background = tgt.bg;
    document.getElementById("target-name").textContent = tgt.name;
    document.getElementById("target-tip").textContent = "👉 在中間的綠色牌裡找出它！";
}

async function showBanner(html, color, ms = 1900) {
    const wrap = document.getElementById("turn-banner");
    const box = document.getElementById("banner-box");
    box.innerHTML = html;
    box.style.setProperty("--bc", color);
    wrap.style.setProperty("--bd", ms + "ms");
    restart(wrap, "show");
    await sleep(ms);
    wrap.classList.remove("show");
}

async function beginTurn() {
    calculateNextTarget();
    updateTurnUI();
    const p = players[cur];
    const tgt = trackPatterns[targetTrackIndex];
    restart(document.getElementById("edge-flash"), "go");
    SFX.turn();
    speak(`輪到${p.name}，請找${tgt.name}`, true);
    if (settings.banner) {
        await showBanner(`🐔 輪到 ${p.name}！<small>請找出：${tgt.symbol} ${tgt.name}</small>`, P_COLORS[p.id], 2000);
    }
}

/* ================= 翻牌大螢幕 ================= */
function showReveal(p, pat, idx) {
    const panel = document.getElementById("reveal-panel");
    const card = document.getElementById("reveal-card");
    panel.style.borderColor = P_COLORS[p.id];
    card.classList.remove("empty");
    card.textContent = pat.symbol;
    card.style.background = pat.bg;
    restart(card, "show");
    const who = document.getElementById("reveal-who");
    who.innerHTML = `<span style="color:${P_COLORS[p.id]}">${p.name}</span> 翻到：${pat.name}`;
    document.querySelectorAll(".mm").forEach(m => m.classList.remove("hit"));
    document.getElementById(`mm-${idx}`).classList.add("hit");
    const r = document.getElementById("reveal-result");
    r.textContent = ""; r.className = "";
}
function setRevealResult(ok, tgt) {
    const r = document.getElementById("reveal-result");
    r.className = ok ? "ok" : "no";
    r.textContent = ok ? "✅ 答對了！" : `❌ 不是${tgt.symbol}`;
    document.getElementById("reveal-panel").style.borderColor = ok ? "#2ecc71" : "#e63946";
}
function clearReveal() {
    const card = document.getElementById("reveal-card");
    card.className = "empty"; card.textContent = "？"; card.style.background = "";
    document.getElementById("reveal-who").textContent = "等待翻牌…";
    document.getElementById("reveal-result").textContent = "";
    document.getElementById("reveal-result").className = "";
    document.getElementById("reveal-panel").style.borderColor = "#ccc";
    document.querySelectorAll(".mm").forEach(m => m.classList.remove("hit"));
}

/* ================= 特效 ================= */
function floatText(x, y, text, color = "#ffb703", size = 38) {
    const el = document.createElement("div");
    el.className = "fx float-txt"; el.textContent = text;
    el.style.color = color; el.style.fontSize = size + "px";
    el.style.left = x + "px"; el.style.top = y + "px";
    document.getElementById("board").appendChild(el);
    el.animate([
        { transform: "translate(-50%,-50%) scale(.4)", opacity: 0 },
        { transform: "translate(-50%,-90%) scale(1.15)", opacity: 1, offset: .25 },
        { transform: "translate(-50%,-160%) scale(1)", opacity: 0 }
    ], { duration: 1300, easing: "ease-out" }).onfinish = () => el.remove();
}
function burst(x, y, emoji, n = 8, dist = 90) {
    const board = document.getElementById("board");
    for (let i = 0; i < n; i++) {
        const el = document.createElement("div");
        el.className = "fx"; el.textContent = emoji; el.style.fontSize = (18 + Math.random() * 16) + "px";
        el.style.left = x + "px"; el.style.top = y + "px";
        board.appendChild(el);
        const ang = Math.random() * Math.PI * 2, d = dist * (0.5 + Math.random() * 0.7);
        el.animate([
            { transform: "translate(-50%,-50%) rotate(0deg)", opacity: 1 },
            { transform: `translate(calc(-50% + ${Math.cos(ang) * d}px), calc(-50% + ${Math.sin(ang) * d + 30}px)) rotate(${Math.random() * 540 - 270}deg)`, opacity: 0 }
        ], { duration: 800 + Math.random() * 400, easing: "cubic-bezier(.2,.8,.4,1)" }).onfinish = () => el.remove();
    }
}
function flyFeather(from, to) {
    return new Promise(res => {
        const el = document.createElement("div");
        el.className = "fx"; el.textContent = "🪶"; el.style.fontSize = "46px";
        el.style.left = from.x + "px"; el.style.top = from.y + "px";
        document.getElementById("board").appendChild(el);
        const dx = to.x - from.x, dy = to.y - from.y;
        el.animate([
            { transform: "translate(-50%,-50%) rotate(0deg) scale(.6)" },
            { transform: `translate(calc(-50% + ${dx * .5}px), calc(-50% + ${dy * .5 - 120}px)) rotate(200deg) scale(1.4)`, offset: .5 },
            { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(400deg) scale(.8)` }
        ], { duration: 750, easing: "ease-in-out" }).onfinish = () => { el.remove(); res(); };
    });
}
function chickenCenter(p) { const tp = trackPositions[p.position]; return { x: tp.cx, y: tp.cy }; }
function cardCenter(idx) {
    const col = idx % 4, row = Math.floor(idx / 4);
    return { x: 323 + col * 134 + 56, y: 228 + row * 126 + 56 };
}

/* ================= 限時翻牌 ================= */
let timerId = null, timeLeft = 0;
function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
    const box = document.getElementById("timer-box");
    box.classList.remove("on", "hurry");
    updateRevealCountdown();
}
function updateRevealCountdown() {
    const card = document.getElementById("reveal-card");
    if (!card.classList.contains("empty")) return;
    const on = !!timerId && settings.timeLimitOn;
    card.classList.toggle("count", on);
    card.classList.toggle("hurry", on && timeLeft <= 5);
    card.textContent = on ? Math.max(0, Math.ceil(timeLeft)) : "？";
    document.getElementById("reveal-who").textContent = on ? "⏰ 快點翻牌！" : "等待翻牌…";
}
function renderTimer() {
    document.getElementById("timer-num").textContent = `⏰ ${Math.ceil(timeLeft)} 秒`;
    document.getElementById("timer-fill").style.width = Math.max(0, timeLeft / settings.timeLimitSec * 100) + "%";
    document.getElementById("timer-box").classList.toggle("hurry", timeLeft <= 5);
    updateRevealCountdown();
}
function startTimer() {
    stopTimer();
    if (!settings.timeLimitOn || gameOver) return;
    timeLeft = settings.timeLimitSec;
    document.getElementById("timer-box").classList.add("on");
    timerId = setInterval(() => {
        if (document.getElementById("settings-overlay").classList.contains("on")) return; // 開設定時暫停
        if (busy) return;
        const before = Math.ceil(timeLeft);
        timeLeft -= 0.25;
        renderTimer();
        if (Math.ceil(timeLeft) < before && timeLeft <= 5 && timeLeft > 0) SFX.tick();
        if (timeLeft <= 0) onTimeUp();
    }, 250);
    renderTimer();
}
async function onTimeUp() {
    stopTimer();
    if (busy || gameOver) return;
    busy = true;
    const p = players[cur];
    SFX.timeout();
    speak("時間到，換下一位", true);
    if (settings.banner) await showBanner(`⏰ 時間到！<small>${p.name} 沒有翻牌，換下一位</small>`, "#6c757d", 1600);
    else await sleep(900);
    cur = (cur + 1) % players.length;
    await beginTurn();
    busy = false;
    startTimer();
}

/* ================= 主流程：點牌 ================= */
async function onCardClick(idx) {
    if (busy || gameOver) return;
    const card = document.getElementById(`center-${idx}`);
    if (card.classList.contains("flipped")) return;
    busy = true;
    stopTimer();
    ensureAudio();

    const p = players[cur];
    const pat = centerPatterns[idx];
    const tgt = trackPatterns[targetTrackIndex];
    const t0 = performance.now();

    SFX.flip();
    card.classList.add("flipped");
    showReveal(p, pat, idx);
    await sleep(600);

    const ok = pat.id === tgt.id;
    const mark = card.querySelector(".mark");
    const cc = cardCenter(idx);

    if (ok) {
        mark.textContent = "✓"; card.classList.add("good");
        SFX.correct();
        setRevealResult(true, tgt);
        speak("答對，繼續找下一張！", true);
        burst(cc.x, cc.y, "⭐", 10, 110);
        floatText(cc.x, cc.y - 40, "答對！", "#2ecc71", 52);
        await sleep(800);

        const won = await moveActiveChicken();
        if (won) return;

        const remain = settings.revealSec * 1000 - (performance.now() - t0);
        if (remain > 0) await sleep(remain);
        closeCard(card);
        clearReveal();
        calculateNextTarget();
        updateTurnUI();
        SFX.go();
        if (settings.banner) {
            const nt = trackPatterns[targetTrackIndex];
            await showBanner(`👍 繼續找下一張！<small>${nt.symbol} ${nt.name}</small>`, P_COLORS[p.id], 1400);
        }
        busy = false;
        startTimer();
    } else {
        mark.textContent = "✗"; card.classList.add("bad");
        SFX.wrong();
        setRevealResult(false, tgt);
        speak("不是喔，換下一位", true);
        floatText(cc.x, cc.y - 40, "不是喔～", "#e63946", 44);
        const remain = settings.revealSec * 1000 - (performance.now() - t0);
        await sleep(Math.max(remain, 900));
        closeCard(card);
        clearReveal();
        await sleep(450);
        cur = (cur + 1) % players.length;
        await beginTurn();
        busy = false;
        startTimer();
    }
}
function closeCard(card) {
    SFX.flip();
    card.classList.remove("flipped", "good", "bad");
}

/* 小雞一步一步跳 + 拔毛 */
async function moveActiveChicken() {
    const p = players[cur];
    const el = chickenEls[p.id];
    const path = [], leaped = [];
    let pos = p.position;
    while (true) {
        pos = (pos + 1) % TRACK_N;
        path.push(pos);
        const occ = players.find(o => o.position === pos && o.id !== p.id);
        if (occ) leaped.push(occ); else break;
    }
    clearArrow();
    document.querySelectorAll(".egg.target").forEach(e => e.classList.remove("target"));
    el.classList.remove("active");
    el.classList.add("moving");

    for (const step of path) {
        placeChicken(p, step);
        restart(el, "hop");
        SFX.hop();
        await sleep(400);
    }
    el.classList.remove("hop");
    p.position = pos;

    for (const v of leaped) await pluck(p, v);

    el.classList.remove("moving");
    el.classList.add("active");

    if (p.feathers === players.length) {
        await sleep(500);
        endGame(p);
        return true;
    }
    return false;
}

async function pluck(p, v) {
    const vc = chickenCenter(v), pc = chickenCenter(p);
    const vel = chickenEls[v.id];
    restart(vel, "shake");
    if (v.feathers <= 0) {
        SFX.swish();
        floatText(vc.x, vc.y - 40, "沒毛可拔了！", "#999", 30);
        await sleep(700);
        return;
    }
    SFX.pluck();
    speak("拔毛！");
    floatText(vc.x, vc.y - 50, "拔毛！", "#ff006e", 46);
    burst(vc.x, vc.y, "🪶", 7, 80);
    const n = v.feathers;
    v.feathers = 0;
    updateScore(v, true);
    await sleep(250);
    for (let i = 0; i < n; i++) {
        await flyFeather(vc, pc);
        p.feathers += 1;
        updateScore(p, true);
        SFX.ding();
        floatText(pc.x, pc.y - 40, "+1 🪶", "#ffb703", 36);
        await sleep(120);
    }
    await sleep(350);
}

/* ================= 勝利 ================= */
function endGame(p) {
    gameOver = true;
    stopTimer();
    clearArrow();
    document.getElementById("winner-announcement").innerHTML = `恭喜 【${p.name}】 成功拔光對手，榮獲雞王寶座！`;
    document.getElementById("win-overlay").style.display = "flex";
    SFX.win();
    speak(`恭喜${p.name}獲勝！`, true);
    const colors = ["#e63946", "#457b9d", "#2a9d8f", "#f4a261", "#ffb703", "#ff006e", "#8338ec"];
    for (let i = 0; i < 140; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.background = colors[i % colors.length];
        document.body.appendChild(c);
        const dur = 2500 + Math.random() * 2500;
        c.animate([
            { transform: "translateY(0) rotate(0deg)" },
            { transform: `translateY(${window.innerHeight + 40}px) translateX(${Math.random() * 200 - 100}px) rotate(${Math.random() * 1080}deg)` }
        ], { duration: dur, delay: Math.random() * 1500, easing: "linear", fill: "forwards" }).onfinish = () => c.remove();
    }
}
