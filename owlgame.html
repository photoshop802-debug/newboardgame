<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>貓頭鷹回家 Hoot Owl Hoot v3</title>
<style>
*,*::before,*::after{box-sizing:border-box;user-select:none;}
html,body{height:100%;margin:0;}
body{font-family:"Microsoft JhengHei","PingFang TC","Segoe UI",sans-serif;background:#141826;color:#f5f6fa;overflow:hidden;transition:background 1.5s;}
body.st-dawn{background:#33284a;}
body.st-day{background:#3b6f9e;}
body.st-hot{background:#c96a12;}
body.st-fire{background:#8e1b12;}
button{font-family:inherit;}

/* 設定 */
#setup-screen{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#25283d;border:1px solid #484b6a;border-radius:20px;padding:26px 30px;width:min(560px,92vw);max-height:94vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.4);}
#setup-screen h1{margin:0 0 14px;text-align:center;color:#ffdd57;font-size:30px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;margin-bottom:6px;font-weight:bold;color:#ffdd57;}
.form-group select,.form-group input{width:100%;padding:10px;border-radius:8px;border:1px solid #484b6a;background:#1a1c29;color:#fff;font-size:16px;margin-bottom:6px;}
.btn{background:#4cd137;color:#1a1c29;border:none;padding:13px 24px;font-size:18px;font-weight:900;border-radius:12px;cursor:pointer;width:100%;}
.btn:hover{filter:brightness(1.08);}

/* 主畫面：左太陽直條｜中版圖｜右玩家 */
#game{display:none;height:100vh;padding:10px 12px;gap:12px;grid-template-columns:clamp(86px,6.5vw,124px) minmax(0,1fr) clamp(250px,21vw,370px);}
#game.on{display:grid;}

/* 太陽直條：上＝日出(終點)、下＝起點 */
#sun-col{display:flex;flex-direction:column;background:linear-gradient(to top,#111424,#2a1b40 35%,#692d42 60%,#b56c4c 80%,#f2c46b);border:3px solid #3a3f58;border-radius:20px;padding:8px 7px;gap:4px;min-height:0;box-shadow:inset 0 0 14px rgba(0,0,0,.5);}
#sun-col .lbl{font-size:clamp(12px,1vw,16px);font-weight:900;text-align:center;color:#fff;text-shadow:0 2px 3px #000;flex:none;}
#sun-track{flex:1;display:flex;flex-direction:column-reverse;gap:4px;min-height:0;}
.sun-cell{flex:1;min-height:0;border-radius:10px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:clamp(16px,1.6vw,28px);position:relative;}
.sun-cell.start{background:rgba(255,255,255,.28);border:2px solid #ffdd57;}
.sun-cell.end{background:linear-gradient(135deg,#e74c3c,#f39c12);border:2px solid #ffdd57;}
.sun-cell .n{position:absolute;left:4px;top:1px;font-size:10px;opacity:.6;}
.sun-token{height:118%;max-width:100%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff6a0,#ffd000 45%,#ff9800);box-shadow:0 0 18px 8px rgba(255,214,0,.85),0 0 40px 14px rgba(255,140,0,.45);display:flex;align-items:center;justify-content:center;font-size:clamp(24px,2.4vw,40px);animation:sunGlow 1.4s infinite alternate;z-index:2;}
@keyframes sunGlow{from{transform:scale(1) rotate(0);}to{transform:scale(1.1) rotate(25deg);}}
.sun-token.moved{animation:sunRise .9s cubic-bezier(.3,1.6,.5,1),sunGlow 1.4s .9s infinite alternate;}
@keyframes sunRise{0%{transform:translateY(120%) scale(.6);}100%{transform:translateY(0) scale(1);}}
#sun-left{flex:none;text-align:center;font-weight:900;font-size:clamp(12px,1vw,16px);color:#ffdd57;text-shadow:0 2px 3px #000;}

/* 版圖 */
#board-area{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 50%,#1e2a1f 0%,#121a14 70%);border-radius:24px;border:3px solid #2e3b2f;overflow:hidden;}
#board{width:100%;height:100%;}
.slot{cursor:pointer;}
.owl{cursor:pointer;}
.owl .inner{transform-box:fill-box;transform-origin:50% 60%;}
.owl.can .inner{animation:owlPulse .7s infinite alternate;}
.owl.can .ring{display:inline;}
.owl .ring{display:none;}
@keyframes owlPulse{from{transform:scale(1);}to{transform:scale(1.13);}}
.preview{animation:prev .6s infinite alternate;}
@keyframes prev{from{opacity:.4;}to{opacity:1;}}
#toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:#fff;color:#333;border:4px solid #e74c3c;border-radius:18px;padding:10px 24px;font-size:clamp(18px,1.6vw,28px);font-weight:900;display:none;z-index:20;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.4);}
#toast.on{display:block;animation:toastIn .4s cubic-bezier(.3,1.6,.5,1);}
@keyframes toastIn{from{transform:translateX(-50%) scale(.4);}to{transform:translateX(-50%) scale(1);}}
#fire{position:absolute;inset:0;pointer-events:none;display:none;background:radial-gradient(circle at 50% 110%,rgba(255,120,0,.75),rgba(200,20,0,.35) 50%,transparent 75%);animation:flick .25s infinite alternate;z-index:15;}
@keyframes flick{from{opacity:.75;}to{opacity:1;}}

/* 右側 */
#right{display:flex;flex-direction:column;gap:10px;min-height:0;}
#turn-box{background:#25283d;border:3px solid #ffdd57;border-radius:16px;padding:10px 12px;flex:none;}
#turn-name{font-size:clamp(20px,1.8vw,30px);font-weight:900;color:#ffdd57;}
#turn-hint{font-size:clamp(13px,1.05vw,17px);color:#dfe4f5;margin-top:4px;line-height:1.35;}
#deck-info{display:flex;align-items:center;gap:10px;background:#25283d;border-radius:14px;padding:6px 12px;font-weight:900;font-size:clamp(14px,1.1vw,18px);flex:none;}
#deck-pile{width:42px;height:52px;border-radius:8px;background:repeating-linear-gradient(45deg,#3d4a8a 0 6px,#33407a 6px 12px);border:3px solid #fff;box-shadow:3px 3px 0 #1b2050;}
#players{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px 4px 4px 2px;}
.pbox{background:#25283d;border:3px solid #3a3f58;border-radius:14px;padding:8px 10px;opacity:.55;transition:opacity .3s,border-color .3s,transform .3s;}
.pbox.active{opacity:1;border-color:#4cd137;box-shadow:0 0 18px rgba(76,209,55,.6);transform:scale(1.02);}
.pname{font-weight:900;font-size:clamp(15px,1.25vw,21px);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.pname .now{display:none;background:#4cd137;color:#111;border-radius:8px;padding:0 8px;font-size:.8em;}
.pbox.active .now{display:inline;animation:nowPulse .8s infinite alternate;}
@keyframes nowPulse{from{transform:scale(1);}to{transform:scale(1.1);}}
.hand{display:flex;gap:8px;padding-top:8px;}
.gcard{width:clamp(50px,4.4vw,80px);aspect-ratio:1;border-radius:12px;background:#fff;border:3px solid #ccc;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;}
.gcard:hover{transform:translateY(-3px);}
.gcard .dot{width:68%;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);}
.gcard.sun{background:#ffd93b;border-color:#f0a500;font-size:clamp(28px,2.6vw,46px);}
.gcard.sel{transform:translateY(-8px) scale(1.08);box-shadow:0 0 0 4px #ffdd57,0 0 22px 6px #ffdd57;}
.gcard.must{animation:must .6s infinite alternate;}
@keyframes must{from{box-shadow:0 0 0 3px #ff5252;}to{box-shadow:0 0 0 6px #ff5252,0 0 24px 8px #ff9800;}}
.gcard.dealt{animation:deal .6s cubic-bezier(.2,1.4,.5,1);}
@keyframes deal{0%{transform:translate(-160px,-140px) rotate(-200deg) scale(.3);opacity:0;}60%{opacity:1;}100%{transform:none;}}
.many .pbox{padding:5px 8px;} .many .pname{margin-bottom:0;font-size:clamp(14px,1.1vw,18px);} .many .hand{padding-top:4px;gap:6px;}
.many .gcard{width:clamp(38px,3.1vw,58px);border-radius:9px;}
#layer-preview text{pointer-events:none;}
#right:has(.many) #log{max-height:7vh;}
#right:has(.many) #turn-hint{font-size:13px;}
#log{flex:none;max-height:16vh;overflow:auto;background:rgba(0,0,0,.25);border-radius:12px;padding:6px 10px;font-size:clamp(12px,.95vw,15px);line-height:1.5;color:#cfd3e6;}

/* 橫幅、結束 */
#banner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:60;}
#banner .ban{background:var(--bc,#2f8f3a);color:#fff;text-align:center;font-size:clamp(32px,4.4vw,78px);font-weight:900;padding:20px 56px;border-radius:60px;border:8px solid #fff;box-shadow:0 20px 60px rgba(0,0,0,.4);text-shadow:0 4px 0 rgba(0,0,0,.25);transform:translateX(-130vw);}
#banner .ban small{display:block;font-size:.48em;margin-top:6px;}
#banner.show .ban{animation:banner var(--bd,1.6s) cubic-bezier(.2,.9,.3,1) forwards;}
@keyframes banner{0%{transform:translateX(-130vw) rotate(-6deg);}18%{transform:translateX(0) rotate(2deg) scale(1.06);}28%{transform:translateX(0) scale(1);}82%{transform:translateX(0);}100%{transform:translateX(130vw) rotate(6deg);}}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:90;align-items:center;justify-content:center;}
.modal-content{background:#25283d;border:3px solid #ffdd57;border-radius:20px;padding:28px;text-align:center;width:min(560px,92vw);}
.modal-content h2{margin:0 0 12px;font-size:30px;}
.modal-content p{font-size:19px;line-height:1.6;}
/* ================= 貓頭鷹媽媽 ================= */
#mom{position:fixed;left:-300px;top:0;z-index:70;width:var(--mw,130px);height:calc(var(--mw,130px) * 1.12);cursor:grab;touch-action:none;}
#mom.dragging{cursor:grabbing;z-index:99;}
#mom svg{width:100%;height:100%;overflow:visible;display:block;}
#mom .flip{width:100%;height:100%;transform:scaleX(var(--fx,1));transition:transform .2s;}
#mom .bub{position:absolute;left:50%;bottom:100%;margin-bottom:12px;transform:translateX(-50%);background:#fff;color:#4a2a5a;border:4px solid #c06cd4;border-radius:18px;padding:5px 14px;
    font-size:clamp(16px,1.4vw,24px);font-weight:900;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 4px 12px rgba(0,0,0,.3);}
#mom .bub.on{opacity:1;}
#mom .bub::before{content:'';position:absolute;left:50%;top:100%;margin-left:-11px;border:solid transparent;border-width:12px 11px 0;border-top-color:#c06cd4;}
#mom .bub.side{bottom:auto;top:10%;left:calc(100% + 16px);transform:none;margin:0;}
#mom .bub.side::before{left:auto;right:100%;top:50%;margin:-11px 0 0;border-width:11px 14px 11px 0;border-color:transparent #c06cd4 transparent transparent;}
#mom .bub.sideL{bottom:auto;top:10%;left:auto;right:calc(100% + 16px);transform:none;margin:0;}
#mom .bub.sideL::before{left:100%;top:50%;margin:-11px 0 0;border-width:11px 0 11px 14px;border-color:transparent transparent transparent #c06cd4;}
#mom .side,#mom .eC,#mom .eH,#mom .mO,#mom .sweat{display:none;}
#mom.side-view .front{display:none;} #mom.side-view .side{display:inline;}
#mom.e-closed .eN{display:none;} #mom.e-closed .eC{display:inline;}
#mom.e-happy .eN{display:none;} #mom.e-happy .eH{display:inline;}
#mom.m-open .mO{display:inline;}
#mom.pant .sweat{display:inline;}
#mom .wl{transform-box:view-box;transform-origin:-30px -4px;}
#mom .wr{transform-box:view-box;transform-origin:30px -4px;}
#mom.flap .wl{animation:wlF .16s infinite alternate ease-in-out;} #mom.flap .wr{animation:wrF .16s infinite alternate ease-in-out;}
@keyframes wlF{from{transform:rotate(25deg);}to{transform:rotate(-55deg);}} @keyframes wrF{from{transform:rotate(-25deg);}to{transform:rotate(55deg);}}
#mom.fan .wl{animation:wlB .32s infinite alternate ease-in-out;} #mom.fan .wr{animation:wrB .32s infinite alternate ease-in-out;}
@keyframes wlB{from{transform:rotate(30deg);}to{transform:rotate(-80deg);}} @keyframes wrB{from{transform:rotate(-30deg);}to{transform:rotate(80deg);}}
#mom.spread .wl{transform:rotate(-80deg) scale(1.3);} #mom.spread .wr{transform:rotate(80deg) scale(1.3);}
#mom.drag .wl{animation:wlF .09s infinite alternate;} #mom.drag .wr{animation:wrF .09s infinite alternate;}
#mom.drag .flip{animation:wob .35s infinite alternate ease-in-out;transform-origin:50% 5%;}
@keyframes wob{from{transform:rotate(-12deg);}to{transform:rotate(12deg);}}
#mom .bodyG{transform-box:view-box;transform-origin:0 60px;}
#mom.pant .bodyG{animation:pantA .35s infinite alternate;}
@keyframes pantA{from{transform:scale(1,1);}to{transform:scale(1.05,.94);}}
#mom.hover .flip{animation:hov 1.1s infinite alternate ease-in-out;}
@keyframes hov{from{transform:scaleX(var(--fx,1)) translateY(0);}to{transform:scaleX(var(--fx,1)) translateY(-8px);}}
#mom .shead{transform-box:view-box;transform-origin:0 -20px;}
#mom.peck .shead{animation:peckA .16s infinite alternate ease-in;}
@keyframes peckA{from{transform:translateX(0) rotate(0);}to{transform:translateX(14px) rotate(10deg);}}
.wind{position:fixed;z-index:69;height:6px;border-radius:3px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.95));pointer-events:none;transform-origin:0 50%;}
.momfx{position:fixed;z-index:71;pointer-events:none;}
#mute-btn{position:fixed;right:14px;bottom:14px;z-index:80;width:50px;height:50px;border-radius:50%;border:none;background:#fff;font-size:24px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.3);}
.confetti{position:fixed;top:-20px;width:12px;height:18px;border-radius:3px;z-index:95;pointer-events:none;}
</style>
</head>
<body>

<button id="mute-btn" onclick="toggleMute()" title="聲音開關">🔊</button>

<div id="setup-screen">
    <h1>🦉 貓頭鷹回家</h1>
    <div class="form-group">
        <label for="player-count">玩家人數（原版 2–4 人，5–6 人也可以玩，平衡不變）：</label>
        <select id="player-count" onchange="updatePlayerInputs()">
            <option value="2">2 人</option><option value="3" selected>3 人</option><option value="4">4 人</option>
            <option value="5">5 人</option><option value="6">6 人</option>
        </select>
    </div>
    <div class="form-group"><label>玩家姓名：</label><div id="player-names-container"></div></div>
    <div class="form-group">
        <label for="owl-count">難度（原版規則）：</label>
        <select id="owl-count">
            <option value="3">新手：3 隻貓頭鷹（起始位置 1、2、3）</option>
            <option value="4" selected>普通：4 隻貓頭鷹（起始位置 1–4）</option>
            <option value="6">困難：6 隻貓頭鷹（起始位置 1–6）</option>
            <option value="5">自訂：5 隻貓頭鷹</option>
        </select>
    </div>
    <div class="form-group">
        <label for="sun-len">太陽軌道長度（調整整體難度，跟人數無關）：</label>
        <select id="sun-len">
            <option value="14">寬鬆：14 格（14 張太陽卡全部打完才天亮）</option>
            <option value="13" selected>原版：13 格</option>
            <option value="11">挑戰：11 格</option>
        </select>
    </div>
    <button class="btn" onclick="startGame()">開始合作挑戰 ➔</button>
</div>

<div id="game">
    <div id="sun-col">
        <div class="lbl">🔥 天亮</div>
        <div id="sun-track"></div>
        <div class="lbl">🌑 起點</div>
        <div id="sun-left"></div>
    </div>
    <div id="board-area">
        <svg id="board" viewBox="0 0 760 760" preserveAspectRatio="xMidYMid meet">
            <defs>
                <radialGradient id="gBowl" cx="50%" cy="45%" r="60%">
                    <stop offset="0" stop-color="#2a170b"/><stop offset=".7" stop-color="#3f2412"/><stop offset="1" stop-color="#5a3519"/>
                </radialGradient>
                <radialGradient id="gSlot" cx="35%" cy="30%" r="75%">
                    <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
                </radialGradient>
                <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity=".55"/></filter>
            </defs>
            <g id="layer-path"></g>
            <g id="layer-nest"></g>
            <g id="layer-slots"></g>
            <g id="layer-owls"></g>
            <g id="layer-preview"></g>
            <g id="layer-fx"></g>
        </svg>
        <div id="toast"></div>
        <div id="fire"></div>
    </div>
    <div id="right">
        <div id="turn-box"><div id="turn-name">輪到…</div><div id="turn-hint"></div></div>
        <div id="deck-info"><div id="deck-pile"></div><span>牌堆剩 <span id="deck-count">0</span> 張</span></div>
        <div id="players"></div>
        <div id="log"></div>
    </div>
</div>

<div id="banner"><div class="ban" id="banner-box"></div></div>
<div id="end-modal" class="modal"><div class="modal-content"><h2 id="end-title"></h2><p id="end-body"></p><button class="btn" onclick="location.reload()">再玩一局 ↩</button></div></div>

<script>
/* ================= 規則資料（依原版規則書） =================
   50 張牌：14 張太陽卡 + 36 張彩色卡（6 色 × 6 張）
   每人 3 張、正面朝上；有太陽卡一定要先打；彩色卡 → 移到前方下一個「沒被佔領」的同色格（可飛越）
   前方沒有該顏色 → 直接飛回巢；全部回巢前太陽到最後一格就輸 */
const COLORS = ["yellow", "blue", "red", "green", "purple", "orange"];
const HEX = { yellow: "#f1c40f", blue: "#2e86de", red: "#e74c3c", green: "#2ecc71", purple: "#9b59b6", orange: "#e67e22" };
const CNAME = { yellow: "黃色", blue: "藍色", red: "紅色", green: "綠色", purple: "紫色", orange: "橘色" };
// 原版版圖（依實體版圖照片）：起點 6→1，接著 33 格路線，最後進巢
const START_COLORS = ["yellow", "green", "orange", "blue", "purple", "red"];          // 起點6、5、4、3、2、1
const PATH_COLORS = ["blue", "purple", "red", "yellow", "green", "blue", "orange", "red", "purple", "yellow", "green",
    "orange", "blue", "purple", "red", "green", "yellow", "orange", "blue", "purple", "red", "yellow", "green",
    "blue", "orange", "red", "purple", "yellow", "green", "blue", "orange", "red", "purple"];
const track = [...START_COLORS, ...PATH_COLORS];
const SLOTS = track.length; let MAX_SUN = 13;
const NSTART = START_COLORS.length;
function slotName(k) { return k < NSTART ? `起點${NSTART - k}` : `第 ${k - NSTART + 1} 格`; }
const CX = 380, CY = 380;
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const G = { players: [], cur: 0, sun: 0, owls: [], deck: [], sel: null, nOwls: 4, over: false, busy: false };
let slotXY = [];

/* ================= 音效（大聲、即時合成） ================= */
let soundOn = true, actx = null, master = null;
function ensureAudio() {
    try {
        if (!actx) {
            actx = new (window.AudioContext || window.webkitAudioContext)();
            const comp = actx.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 4;
            master = actx.createGain(); master.gain.value = 1.4; master.connect(comp); comp.connect(actx.destination);
        }
        if (actx.state === "suspended") actx.resume();
    } catch (e) {}
}
function tone(f, dur, o = {}) {
    if (!soundOn || !actx) return;
    const { type = "sine", vol = .3, delay = 0, slide = null, vib = 0 } = o, t = actx.currentTime + delay;
    const s = actx.createOscillator(), g = actx.createGain();
    s.type = type; s.frequency.setValueAtTime(f, t); if (slide) s.frequency.exponentialRampToValueAtTime(slide, t + dur);
    if (vib) { const l = actx.createOscillator(), lg = actx.createGain(); l.frequency.value = 6; lg.gain.value = vib; l.connect(lg); lg.connect(s.frequency); l.start(t); l.stop(t + dur + .05); }
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(g); g.connect(master); s.start(t); s.stop(t + dur + .05);
}
function noise(dur, o = {}) {
    if (!soundOn || !actx) return;
    const { vol = .3, delay = 0, from = 800, to = 3000, q = 1, type = "bandpass" } = o, t = actx.currentTime + delay;
    const len = Math.floor(actx.sampleRate * dur), buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = actx.createBufferSource(); src.buffer = buf;
    const f = actx.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(from, t); f.frequency.exponentialRampToValueAtTime(to, t + dur);

function windTo(x1, y1, x2, y2, n = 7) {
    const ang = Math.atan2(y2 - y1, x2 - x1), len = Math.hypot(x2 - x1, y2 - y1);
    for (let k = 0; k < n; k++) setTimeout(() => {
        const w = document.createElement("div"); w.className = "wind";
        const off = (Math.random() - .5) * 70;
        w.style.left = (x1 - Math.sin(ang) * off) + "px"; w.style.top = (y1 + Math.cos(ang) * off) + "px";
        w.style.width = (50 + Math.random() * 50) + "px"; w.style.transform = `rotate(${ang}rad)`;
        document.body.appendChild(w);
        w.animate([{ transform: `rotate(${ang}rad) translateX(0)`, opacity: 0 }, { opacity: 1, offset: .2 }, { transform: `rotate(${ang}rad) translateX(${len * .9}px)`, opacity: 0 }],
            { duration: 700, easing: "ease-out" }).onfinish = () => w.remove();
    }, k * 90);
}

async function mb1(r) {   // 飛到最後面的孩子旁邊說加油
    const i = rearOwl(); if (i < 0) return;

    fxEmoji(p.x - 40, p.y - 40, ["💪", "✨", "💜"], 6);
    await mWait(2800, r); mFace("");
}
async function mb2(r) {   // 飛去擋太陽
    const s = sunXY();

}
async function mb3(r) {   // 到巢穴親吻已到家的孩子

}

}
async function mb5(r) {   // 對太陽搧翅膀
    const s = sunXY();

async function mb6(r) {   // 米字型飛過整個畫面，最後停下喘氣
    const b = $("board-area").getBoundingClientRect(), m = 70;
    const L = b.left + m, R = b.right - m, T = b.top + m, B = b.bottom - m, cx = (L + R) / 2, cy = (T + B) / 2;
    const pts = [[L, cy], [R, cy], [cx, T], [cx, B], [L, T], [R, B], [R, T], [L, B], [cx, cy]];
    mSay("呼～咻～咻～！", 1500);
    for (const [x, y] of pts) if (!await mFly(x, y, r, 950)) return;
    mAct("pant"); mFace("e-closed m-open"); mSay("呼…呼…好累喔……");

async function mb7(r) {   // 學啄木鳥啄外圈圓圈
    const free = []; for (let k = NSTART; k < NSTART + 22; k++) if (!G.owls.includes(k)) free.push(k);
    const k = free[Math.floor(Math.random() * free.length)], p = svgToScreen(slotXY[k]);

        $("layer-fx").appendChild(c);

async function mb8(r) {   // 對孩子搧翅膀，想把他吹回家
    const live = G.owls.map((o, i) => o !== "nest" ? i : -1).filter(i => i >= 0); if (!live.length) return;
    const i = live[Math.floor(Math.random() * live.length)];
    const o = svgToScreen(owlXY(i)), n = svgToScreen({ x: CX, y: CY });
    const dx = o.x - n.x, dy = o.y - n.y, d = Math.hypot(dx, dy) || 1;
    if (!await mFly(o.x + dx / d * 110, o.y + dy / d * 110, r)) return;
    mDir(-dx); mAct("fan"); mFace("m-open"); mSay(`呼～呼～${i + 1} 號飛回家吧！`);
    for (let k = 0; k < 4; k++) { if (!mAlive(r)) return; MSFX.wind(); windTo(MOM.x, MOM.y, o.x - dx / d * 60, o.y - dy / d * 60, 6); await mWait(800, r); }
    mFace("");
}
const MOM_BEH = [mb1, mb2, mb3, mb4, mb5, mb6, mb7, mb8];
async function momLoop() {
    while (MOM.active) {
        if (MOM.drag || G.over) { await sleep(400); continue; }
        const r = MOM.run;
        let k; do { k = Math.floor(Math.random() * MOM_BEH.length); } while (k === MOM.last);
        MOM.last = k;
        try { await MOM_BEH[k](r); } catch (e) {}
        if (r !== MOM.run) continue;
        mAct("hover"); mFace("");
        if (++MOM.n % 4 === 0 && mAlive(r)) { mSay("孩子們！快回家啊！我們不能曬到太陽！", 2600); momSpeak("孩子們！快回家啊！我們不能曬到太陽！"); }
        await mWait(2500 + Math.random() * 2500, r);
    }
}
/* 拎起來 */
let mAngry = null;
function momGrab(e) {
    e.preventDefault(); ensureAudio();
    MOM.run++; MOM.drag = true;
    mAct("drag"); mFace("m-open"); mDir(1); MOM.el.classList.add("dragging");
    MSFX.oops(); mSay("哎呀！放我下來！我要去照顧孩子！");
    mAngry = setInterval(() => { MSFX.oops(); mSay(["哎呀呀！", "放我下來啦～", "我的裙子要皺了！"][Math.floor(Math.random() * 3)]); }, 1500);
    momMove(e);
    window.addEventListener("pointermove", momMove); window.addEventListener("pointerup", momDrop);
}
function momMove(e) { mPlace(e.clientX, e.clientY + MOM.H * .4); }
async function momDrop() {
    clearInterval(mAngry);
    window.removeEventListener("pointermove", momMove); window.removeEventListener("pointerup", momDrop);
    MOM.el.classList.remove("dragging"); mAct("hover"); mFace("e-closed"); mSay("哼！我還要去幫孩子們！", 1600);
    await sleep(1600); mFace(""); MOM.drag = false;
}
function startMom() {
    if (MOM.active || G.over) return;
    MOM.W = Math.max(100, Math.min(150, innerWidth * .075)); MOM.H = MOM.W * 1.12;
    MOM.el = document.createElement("div"); MOM.el.id = "mom"; MOM.el.style.setProperty("--mw", MOM.W + "px");
    MOM.el.innerHTML = `<div class="bub"></div><div class="flip">${momSVG()}</div>`;
    document.body.appendChild(MOM.el);
    MOM.el.addEventListener("pointerdown", momGrab);
    MOM.active = true;
    const b = $("board-area").getBoundingClientRect();
    mPlace(innerWidth + MOM.W, innerHeight + MOM.H);
    (async () => {
        const r = MOM.run;
        await mFly(b.right - MOM.W * .9, b.bottom - MOM.H * .8, r, 420);
        if (mAlive(r)) { mFace("m-open"); MSFX.coo(); mSay("孩子們！快回家啊！我們不能曬到太陽！", 3200); momSpeak("孩子們！快回家啊！我們不能曬到太陽！"); await mWait(3400, r); mFace(""); }
        momLoop();
    })();
}
